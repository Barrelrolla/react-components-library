    <style>
      @font-face {
        font-family: 'Nunito Sans';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('./sb-common-assets/nunito-sans-regular.woff2') format('woff2');
      }

      @font-face {
        font-family: 'Nunito Sans';
        font-style: italic;
        font-weight: 400;
        font-display: swap;
        src: url('./sb-common-assets/nunito-sans-italic.woff2') format('woff2');
      }

      @font-face {
        font-family: 'Nunito Sans';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url('./sb-common-assets/nunito-sans-bold.woff2') format('woff2');
      }

      @font-face {
        font-family: 'Nunito Sans';
        font-style: italic;
        font-weight: 700;
        font-display: swap;
        src: url('./sb-common-assets/nunito-sans-bold-italic.woff2') format('woff2');
      }
    </style>

    <link href="./sb-manager/runtime.js" rel="modulepreload" />

      <style>
  html,
  body {
    background: oklch(0.27 0.03 247) !important;
    color: oklch(0.94 0 248);
  }

  #storybook-initial-loader {
    position: fixed;
    inset: 0;
    z-index: 999999;
    display: grid;
    place-items: center;
    background: oklch(0.27 0.03 247);
    color: oklch(0.94 0 248);
    text-align: center;
  }

  #initial-loader-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
  }

  #initial-loader-spinner {
    width: 32px;
    height: 32px;
    border: 2px solid rgba(97, 97, 97, 0.29);
    border-top-color: oklch(0.94 0 248);
    border-radius: 50%;
    animation: storybook-initial-spin 0.7s linear infinite;
  }

  @keyframes storybook-initial-spin {
    to {
      transform: rotate(360deg);
    }
  }

  @media (prefers-color-scheme: light) {
    html,
    body {
      background: oklch(0.94 0 248) !important;
      color: oklch(0.27 0.03 247);
    }

    #storybook-initial-loader {
      background: oklch(0.94 0 248);
      color: oklch(0.27 0.03 247);
    }

    #initial-loader-spinner {
      border-top-color: oklch(0.27 0.03 247);
    }
  }
</style>

<div id="storybook-initial-loader">
  <div id="initial-loader-content">
    <div>
      Barrelrolla's<br />
      React components library<br />
      loading...
    </div>

    <div id="initial-loader-spinner"></div>
  </div>
</div>
 

    <style>
      #storybook-root[hidden] {
        display: none !important;
      }
    </style>

    
  </head>
  <body>
    <div id="root"></div>

    
    <script>
      
        
          window['FEATURES'] = {
  "actions": true,
  "argTypeTargetsV7": true,
  "babelRemoveBugfixes": false,
  "backgrounds": true,
  "changeDetection": true,
  "componentsManifest": false,
  "controls": true,
  "disallowImplicitActionsInRenderV8": true,
  "highlight": true,
  "interactions": true,
  "legacyDecoratorFileOrder": false,
  "measure": true,
  "outline": true,
  "menuOnboardingChecklist": true,
  "sidebarOnboardingChecklist": true,
  "viewport": true
};
        
      
        
          window['REFS'] = {};
        
      
        
          window['LOGLEVEL'] = "info";
        
      
        
          window['DOCS_OPTIONS'] = {
  "defaultName": "Docs"
};
        
      
        
          window['CONFIG_TYPE'] = "PRODUCTION";
        
      
        
          window['DOCGEN_STORY_PREPARED'] = false;
        
      
        
      
        
      
        
          window['TAGS_OPTIONS'] = {};
        
      
        
          window['STORYBOOK_BUILDER'] = "vite";
        
      
        
          window['STORYBOOK_FRAMEWORK'] = "react-vite";
        
      
        
          window['STORYBOOK_RENDERER'] = "react";
        
      
        
      
    </script>
    

    <script type="module">
      import './sb-manager/globals-runtime.js';

      
        import './sb-addons/storybook-core-server-presets-0/common-manager-bundle.js';

        import './sb-addons/themes-2/manager-bundle.js';

        import './sb-addons/docs-4/manager-bundle.js';
      
        import './sb-addons/storybook-dark-mode-esm-preset-5/manager-bundle.js';
      
        import './sb-addons/storybook-6/manager-bundle.js';
      

      import './sb-manager/runtime.js';
    </script>
  </body>
